<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Suivi — Vue coach</title>
  <meta name="theme-color" content="#0a2540" />
  <style>
    :root{--bg:#071a2e;--bg2:#0a2540;--card:#0e2c4d;--line:#1d4670;--text:#eaf2fb;--muted:#9bb6d2;--accent:#4a9ae8;--green:#2ecc8f;--danger:#e0586b}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
    header{padding:18px;text-align:center;background:linear-gradient(160deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
    h1{margin:0;font-size:1.2rem;letter-spacing:.12em}
    .sub{color:var(--muted);font-size:.78rem;margin-top:4px}
    main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
    .card h2{margin:0 0 10px;font-size:1rem}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media(min-width:460px){.grid{grid-template-columns:repeat(4,1fr)}}
    .stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
    .stat b{display:block;font-size:1.25rem}
    .stat span{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
    .track{height:16px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
    .fill{height:100%;background:linear-gradient(90deg,var(--green),#54e0aa);border-radius:999px;transition:width .5s}
    .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .badge{background:var(--green);color:#06281c;font-weight:800;padding:4px 10px;border-radius:999px}
    .muted{color:var(--muted);font-size:.85rem}
    svg{width:100%;height:auto;display:block}
    input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:.95rem;width:100%}
    label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:8px}
    button{min-height:46px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;width:100%;cursor:pointer}
    details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
    .err{color:var(--danger);font-size:.85rem}
    .list-item{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between}
    .list-item .d{color:var(--muted);font-size:.78rem}
  </style>
</head>
<body>
  <header>
    <h1>SUIVI — VUE COACH</h1>
    <div class="sub" id="who">Lecture seule • mise à jour automatique</div>
  </header>
  <main>
    <div class="card" id="status-card">
      <p class="muted" id="status">Chargement…</p>
      <p class="err" id="error" hidden></p>
    </div>

    <div class="card" id="dash" hidden>
      <div class="head"><h2>Progression</h2><span class="badge" id="pct">0 %</span></div>
      <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
      <div class="grid" style="margin-top:14px">
        <div class="stat"><b id="s-actuel">—</b><span>Poids actuel</span></div>
        <div class="stat"><b id="s-perdu">—</b><span>Perdu</span></div>
        <div class="stat"><b id="s-reste">—</b><span>Reste</span></div>
        <div class="stat"><b id="s-jours">—</b><span>Jours avant départ</span></div>
      </div>
    </div>

    <div class="card" id="chart-card" hidden>
      <h2>Courbe du poids</h2>
      <div id="chart"></div>
    </div>

    <div class="card" id="steps-card" hidden>
      <div class="grid">
        <div class="stat"><b id="s-pas7">—</b><span>Pas (7 j)</span></div>
        <div class="stat"><b id="s-maj">—</b><span>Dernière saisie</span></div>
      </div>
    </div>

    <div class="card" id="pas7-card" hidden>
      <h2>Pas — 7 derniers jours</h2>
      <div id="pas7-chart"></div>
    </div>

    <div class="card" id="steps-chart-card" hidden>
      <h2>Pas par jour (historique)</h2>
      <div id="steps-chart"></div>
    </div>

    <div class="card" id="recent-card" hidden>
      <h2>Historique quotidien</h2>
      <div id="recent"></div>
    </div>

    <div class="card">
      <button id="refresh">Rafraîchir</button>
      <details style="margin-top:12px">
        <summary>Réglages de la source</summary>
        <div style="margin-top:10px">
          <label>Owner<input id="cfg-owner" /></label>
          <label>Repo<input id="cfg-repo" /></label>
          <label>Branche<input id="cfg-branch" /></label>
          <label>Chemin<input id="cfg-path" /></label>
          <button id="cfg-save" style="margin-top:6px">Enregistrer</button>
        </div>
      </details>
    </div>
  </main>

  <script>
  (() => {
    'use strict';
    const KEY = 'coach-config';
    const DEF = { owner:'thesangu', repo:'Aventuuuure', branch:'claude/stoic-goodall-cY7kL', path:'data/suivi.json' };
    let cfg = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}'));

    const $ = (s) => document.querySelector(s);
    const num = (v,f=0)=>{const n=parseFloat(v);return Number.isFinite(n)?n:f;};
    const parseISO = (iso)=>{if(!iso)return null;const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
    const todayISO = ()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
    const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
    const fmtKg=(v)=>(Math.round(v*10)/10).toFixed(1)+' kg';
    const fmtDate=(iso)=>{const d=parseISO(iso);return d?d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'—';};
    const encPath=(p)=>String(p).split('/').map(encodeURIComponent).join('/');

    function fillCfg(){ $('#cfg-owner').value=cfg.owner; $('#cfg-repo').value=cfg.repo; $('#cfg-branch').value=cfg.branch; $('#cfg-path').value=cfg.path; }
    fillCfg();
    $('#cfg-save').addEventListener('click',()=>{cfg={owner:$('#cfg-owner').value.trim(),repo:$('#cfg-repo').value.trim(),branch:$('#cfg-branch').value.trim(),path:$('#cfg-path').value.trim()};localStorage.setItem(KEY,JSON.stringify(cfg));load();});
    $('#refresh').addEventListener('click',load);

    async function load(){
      $('#error').hidden=true;
      $('#status').textContent='Chargement…';
      try{
        const parsed = await fetchData();
        if(parsed===null){ $('#status').textContent='Aucune donnée pour le moment (le fichier n\'existe pas encore).'; return; }
        // Fusionne les pas envoyés par le Raccourci (fichiers data/pas/<date>.json)
        try { await mergeShortcutSteps(parsed); } catch(e){ /* pas bloquant */ }
        render(parsed);
      }catch(e){
        $('#status').textContent='';
        $('#error').hidden=false;
        $('#error').textContent='Impossible de charger les données : '+e.message+'. Vérifie owner/repo/branche/chemin et que le dépôt est public.';
      }
    }

    // Lecture sans jeton : raw.githubusercontent.com (CDN, CORS, sans quota),
    // avec repli sur l'API "contents" publique. Renvoie l'objet, ou null si absent.
    async function fetchData(){
      const bust = 't=' + Date.now();
      const rawUrl = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${encPath(cfg.path)}?${bust}`;
      try{
        const r = await fetch(rawUrl, { cache:'no-store' });
        if(r.status===404) return null;
        if(r.ok) return JSON.parse(await r.text());
      }catch(e){ /* on tente l'API */ }
      const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encPath(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}&${bust}`;
      const r2 = await fetch(apiUrl, { headers:{'Accept':'application/vnd.github.raw'}, cache:'no-store' });
      if(r2.status===404) return null;
      if(!r2.ok) throw new Error('HTTP '+r2.status);
      return JSON.parse(await r2.text());
    }

    // Récupère les pas écrits par le Raccourci iPhone (un fichier data/pas/<date>.json
    // par jour) sur les 30 derniers jours, et les fusionne dans data.pas.
    async function mergeShortcutSteps(parsed){
      const data = parsed.data || parsed;
      data.pas = Array.isArray(data.pas) ? data.pas : [];
      const map = {}; data.pas.forEach(p=>{ map[p.date]=num(p.pas); });
      const t = parseISO(todayISO()); const dates=[];
      for(let i=0;i<30;i++) dates.push(isoOf(new Date(t - i*864e5)));
      const res = await Promise.all(dates.map(async d=>{
        const url = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/data/pas/${d}.json?t=${Date.now()}`;
        try{ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) return null; const j=JSON.parse(await r.text()); return (j&&j.date)?{date:j.date,pas:num(j.pas)}:null; }
        catch(e){ return null; }
      }));
      res.filter(Boolean).forEach(p=>{ map[p.date]=p.pas; }); // le Raccourci fait foi
      data.pas = Object.keys(map).map(d=>({date:d,pas:map[d]}));
    }

    function render(parsed){
      const data=parsed.data||parsed;
      const s=data.settings||{};
      const prenom=(s.prenom||'').trim();
      $('#who').textContent = (prenom?prenom+' • ':'') + 'maj '+(parsed.majLe?new Date(parsed.majLe).toLocaleString('fr-FR'):'—');
      $('#status').textContent='';

      const poids=[...(data.poids||[])].sort((a,b)=>a.date.localeCompare(b.date));
      const dep=num(s.poidsDepart,150),cible=num(s.poidsCible,100);
      const actuel=poids.length?num(poids[poids.length-1].poids,dep):dep;
      const prog=dep===cible?1:Math.max(0,Math.min(1,(dep-actuel)/(dep-cible)));
      const pct=Math.round(prog*100);
      $('#fill').style.width=pct+'%'; $('#pct').textContent=pct+' %';
      $('#s-actuel').textContent=fmtKg(actuel);
      $('#s-perdu').textContent=fmtKg(Math.max(0,dep-actuel));
      $('#s-reste').textContent=fmtKg(Math.max(0,actuel-cible));
      const jrs=daysBetween(todayISO(),s.dateExpedition||'2027-08-10');
      $('#s-jours').textContent=jrs>=0?jrs:0;
      $('#dash').hidden=false;

      // Pas 7 j
      const limite=new Date(parseISO(todayISO())-6*864e5);
      const pas7=(data.pas||[]).filter(p=>parseISO(p.date)>=limite).reduce((t,p)=>t+num(p.pas),0);
      $('#s-pas7').textContent=pas7.toLocaleString('fr-FR');
      $('#s-maj').textContent=poids.length?fmtDate(poids[poids.length-1].date):'—';
      $('#steps-card').hidden=false;

      // Courbe du poids
      $('#chart').innerHTML=chart(poids,dep,cible);
      $('#chart-card').hidden=poids.length===0;

      // Pas des 7 derniers jours (jour par jour)
      const pas=[...(data.pas||[])].sort((a,b)=>a.date.localeCompare(b.date));
      $('#pas7-chart').innerHTML=bar7(pas);
      $('#pas7-card').hidden = pas.length===0;

      // Graphique des pas par jour (historique complet)
      $('#steps-chart').innerHTML=barChart(pas);
      $('#steps-chart-card').hidden=pas.length===0;

      // Historique quotidien combiné (date · poids · pas), du plus récent au plus ancien
      const parJour={};
      poids.forEach(p=>{ (parJour[p.date]=parJour[p.date]||{}).poids=num(p.poids); });
      pas.forEach(p=>{ (parJour[p.date]=parJour[p.date]||{}).pas=num(p.pas); });
      const jours=Object.keys(parJour).sort((a,b)=>b.localeCompare(a));
      $('#recent').innerHTML = jours.length ? jours.map(d=>`<div class="list-item">
        <span class="d">${fmtDate(d)}</span>
        <span>${parJour[d].poids!=null?'<b>'+fmtKg(parJour[d].poids)+'</b>':'<span class="d">—</span>'}
        &nbsp;·&nbsp; ${parJour[d].pas!=null?parJour[d].pas.toLocaleString('fr-FR')+' pas':'<span class="d">—</span>'}</span>
      </div>`).join('') : '<p class="muted">—</p>';
      $('#recent-card').hidden = jours.length===0;
    }

    // Graphique en barres : pas par jour.
    function barChart(arr){
      if(!arr.length) return '';
      const W=340,H=180,pad={t:14,r:10,b:26,l:40},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
      const max=Math.max(...arr.map(p=>num(p.pas)),1);
      const n=arr.length;
      const gap=n>1?Math.min(8,iw/n*0.25):0;
      const bw=(iw-(n-1)*gap)/n;
      let grid='';
      for(let t=0;t<=3;t++){const v=(t/3)*max,yy=pad.t+ih-(v/max)*ih;grid+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#1d4670"/><text x="${pad.l-6}" y="${yy+3}" fill="#9bb6d2" font-size="9" text-anchor="end">${Math.round(v/1000)}k</text>`;}
      const bars=arr.map((p,i)=>{
        const v=num(p.pas),h=(v/max)*ih,x=pad.l+i*(bw+gap),y=pad.t+ih-h;
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" fill="#4a9ae8"/>`;
      }).join('');
      const xl=`<text x="${pad.l}" y="${H-8}" fill="#9bb6d2" font-size="9" text-anchor="start">${fmtDateShort(arr[0].date)}</text>`+
        (n>1?`<text x="${W-pad.r}" y="${H-8}" fill="#9bb6d2" font-size="9" text-anchor="end">${fmtDateShort(arr[n-1].date)}</text>`:'');
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pas par jour">${grid}${bars}${xl}</svg>`;
    }
    function fmtDateShort(iso){const d=parseISO(iso);return d?d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}):'';}
    const isoOf=(d)=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);

    // 7 derniers jours (aujourd'hui inclus), une barre étiquetée par jour, 0 si absent.
    function bar7(arr){
      const map={}; arr.forEach(p=>map[p.date]=num(p.pas));
      const t=parseISO(todayISO()); const serie=[];
      for(let i=6;i>=0;i--){const d=new Date(t-i*864e5),iso=isoOf(d);serie.push({pas:map[iso]||0,label:d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')});}
      if(serie.reduce((s,p)=>s+p.pas,0)===0) return '<p class="muted">Aucun pas sur les 7 derniers jours.</p>';
      const W=340,H=170,pad={t:18,r:8,b:30,l:8},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
      const max=Math.max(...serie.map(p=>p.pas),1),slot=iw/7,bw=slot*0.6;
      const bars=serie.map((p,i)=>{
        const h=(p.pas/max)*ih,x=pad.l+i*slot+(slot-bw)/2,y=pad.t+ih-h;
        const val=p.pas?p.pas.toLocaleString('fr-FR'):'';
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="#4a9ae8"/>`+
          (val?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" fill="#eaf2fb" font-size="8.5" text-anchor="middle">${val}</text>`:'')+
          `<text x="${(x+bw/2).toFixed(1)}" y="${H-10}" fill="#9bb6d2" font-size="9" text-anchor="middle">${p.label}</text>`;
      }).join('');
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pas des 7 derniers jours">${bars}</svg>`;
    }

    function chart(tri,dep,cible){
      if(!tri.length) return '';
      const W=340,H=200,pad={t:14,r:12,b:24,l:38},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
      const vals=tri.map(p=>num(p.poids));
      let min=Math.min(...vals,cible),max=Math.max(...vals,dep);
      if(min===max){min-=1;max+=1;} const m=(max-min)*0.08||1; min-=m; max+=m;
      const n=tri.length;
      const x=i=>pad.l+(n===1?iw/2:(i/(n-1))*iw);
      const y=v=>pad.t+ih-((v-min)/(max-min))*ih;
      let grid='';
      for(let t=0;t<=4;t++){const v=min+(t/4)*(max-min),yy=y(v);grid+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#1d4670"/><text x="${pad.l-6}" y="${yy+3}" fill="#9bb6d2" font-size="9" text-anchor="end">${Math.round(v)}</text>`;}
      let cl=''; if(cible>=min&&cible<=max){const yc=y(cible);cl=`<line x1="${pad.l}" y1="${yc}" x2="${W-pad.r}" y2="${yc}" stroke="#2ecc8f" stroke-dasharray="4 4" opacity=".7"/>`;}
      const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const pts=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="#4a9ae8"/>`).join('');
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe du poids">${grid}${cl}<path d="${path}" fill="none" stroke="#4a9ae8" stroke-width="2" stroke-linejoin="round"/>${pts}</svg>`;
    }

    load();
    setInterval(load, 5*60*1000); // rafraîchit toutes les 5 minutes
  })();
  </script>
</body>
</html>
